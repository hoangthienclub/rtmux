[package]
name = "rtmux-desktop"
version = "0.1.0"
description = "RTMUX Desktop - DevOps & SSH Hub"
authors = ["Thien Tran"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "1.6", features = ["shell-open", "devtools", "dialog-all", "fs-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
portable-pty = "0.9.0"

[profile.release]
opt-level = "s"       # Tối ưu hóa kích thước và bộ nhớ RAM
lto = true            # Link-time optimization thu nhỏ mã máy
codegen-units = 1     # Tối ưu hóa toàn cục
panic = "abort"       # Giảm overhead runtime của unwinding
strip = true          # Cắt bỏ toàn bộ debug symbols thừa
