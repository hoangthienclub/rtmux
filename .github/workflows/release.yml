name: Release Multi-OS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release & Changelog
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      release_name: ${{ steps.release_info.outputs.release_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Release Info & Changelog
        id: release_info
        run: node scripts/prepare-release.cjs

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: ${{ steps.release_info.outputs.notes_path }}
          draft: false
          prerelease: false

  build-tauri:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Universal Rust Targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build Tauri App & Upload Release Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      # ========================================================
      # PORTABLE BUILDS PACKAGING & UPLOAD
      # ========================================================

      # 1. Windows Portable (Single-file exe & standalone zip)
      - name: Build Windows Portable Package
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-portable.ps1

      - name: Upload Windows Portable Artifacts
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          fail_on_unmatched_files: false
          files: |
            dist-build/windows/rtmux-portable.exe
            dist-build/windows/rtmux-windows-portable.zip
            dist-build/windows/rtmux-portable-vpn.exe
            dist-build/windows/rtmux-windows-portable-vpn.zip

      # 2. Linux Portable (Standalone tar.gz executable)
      - name: Package Linux Portable Archive
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p dist-build/linux
          cp src-tauri/target/release/rtmux-desktop dist-build/linux/rtmux-desktop
          chmod +x dist-build/linux/rtmux-desktop
          tar -czvf dist-build/linux/rtmux-linux-x86_64-portable.tar.gz -C dist-build/linux rtmux-desktop

      - name: Upload Linux Portable Artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          fail_on_unmatched_files: false
          files: |
            dist-build/linux/rtmux-linux-x86_64-portable.tar.gz

      # 3. macOS Portable (Standalone .app zip & tar.gz)
      - name: Package macOS Portable Archive
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p dist-build/macos
          APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -n 1)
          echo "Found macOS App at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            echo "Applying Ad-hoc Code Signing to app bundle..."
            codesign --force --deep --sign - "$APP_PATH"

            # Create helper launcher script to bypass Gatekeeper quarantine
            cat << 'EOF' > dist-build/macos/Open-App-If-Blocked.command
#!/bin/bash
DIR="$(cd "$(dirname "$0")" && pwd)"
APP="$DIR/rtmux-desktop.app"
if [ ! -d "$APP" ]; then
  APP=$(find "$DIR" -name "*.app" -maxdepth 2 | head -n 1)
fi
echo "======================================================="
echo " RTMUX Desktop - macOS Gatekeeper Bypass Launcher"
echo "======================================================="
if [ -n "$APP" ]; then
  echo "Đang gỡ bỏ cờ cách ly (Quarantine) cho $APP..."
  xattr -cr "$APP" 2>/dev/null
  echo "Đang mở ứng dụng RTMUX Desktop..."
  open "$APP"
else
  echo "Không tìm thấy file .app"
fi
EOF
            chmod +x dist-build/macos/Open-App-If-Blocked.command

            # Stage portable zip contents
            STAGING="dist-build/macos/staging"
            mkdir -p "$STAGING"
            cp -R "$APP_PATH" "$STAGING/"
            cp dist-build/macos/Open-App-If-Blocked.command "$STAGING/"

            # Create portable zip & tarball
            ditto -c -k "$STAGING" dist-build/macos/rtmux-macos-portable.zip
            tar -czvf dist-build/macos/rtmux-macos-portable.tar.gz -C "$STAGING" .
          fi

      - name: Upload macOS Portable Artifacts
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          fail_on_unmatched_files: false
          files: |
            dist-build/macos/rtmux-macos-portable.zip
            dist-build/macos/rtmux-macos-portable.tar.gz
